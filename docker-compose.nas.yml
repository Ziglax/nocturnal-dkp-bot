# Stack complète pour NAS Synology DS1819+ (Atom C3538, pas d'instruction AVX) :
# identique à docker-compose.yml, sauf :
#  - MongoDB : les versions >= 5.0 exigent AVX au démarrage, on utilise donc
#    mongo:4.4, dernière version sans cette exigence (EOL mais suffisante pour un
#    banc de test). L'image 4.4 n'embarque pas mongosh : le healthcheck passe
#    par le shell `mongo`.
#  - pas de section `logging:` : voir la note sur le service dkp-bot.
#
# Lancement sur le NAS (fichier autonome, un seul -f) :
#   sudo docker compose -f docker-compose.nas.yml up -d --build
#
# Pour l'interface Container Manager (DSM) : renommer ce fichier en
# docker-compose.yml sur le NAS (en remplaçant celui de prod) et créer un projet.
services:
  dkp-bot:
    build: .
    # Explicit tag: without it, compose names the built image <project>-<service>
    # ("dkp-bot-dkp-bot"), which reads oddly in container UIs.
    image: dkp-bot:latest
    container_name: dkp-bot
    restart: unless-stopped
    # PID-1 init reaps zombies and forwards SIGTERM (node ignores it as PID 1,
    # so without this every stop/restart hangs 10s before SIGKILL).
    init: true
    # MONGO_URL in .env must use the compose service name: mongodb://mongo:27017
    # (localhost inside the container is the container itself).
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    # No `logging:` block on purpose. The Synology Docker daemon defaults to its own
    # `db` log driver, and that driver is the only one Container Manager's "Log" tab
    # can read: forcing json-file here (as docker-compose.yml does) leaves the tab
    # empty, with no log file reachable from File Station either. Rotation is
    # handled by Container Manager (Settings > Log).
    volumes:
      # Source code, configs, ./backups, ./logs — live from the host.
      # - Code changes:       `docker compose restart dkp-bot`
      # - .env changes:       `docker compose up -d` (restart keeps creation-time env)
      # - Dependency changes: `docker compose up -d --build -V`
      #   (-V renews the anonymous node_modules volume, which otherwise survives
      #   rebuilds; never use `down -v` — it also wipes the mongo-data volume)
      - ./:/app
      # Anonymous volume preserves the image's node_modules instead of letting the
      # host bind-mount mask it (host has no node_modules, and native deps such as
      # @snazzah/davey / ffmpeg-static differ between the host OS and Debian).
      - /app/node_modules

  mongo:
    image: mongo:4.4
    container_name: dkp-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
